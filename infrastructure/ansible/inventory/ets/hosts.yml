# The VMs the ÉTS provides, one line each under its group (ADR-0010). For the MVP, one VM can be in
# every group. log791_address is the address the other VMs reach it at, when its default route's
# is not that one:
#   web:
#     hosts:
#       log791-web-1.example.etsmtl.ca:
#         log791_address: 10.0.0.11
all:
  children:
    web:
      hosts: {}
    judge:
      hosts: {}
    db:
      hosts: {}
