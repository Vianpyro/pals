---
# Stateless and interchangeable (ADR-0010): a judge that stops leaves its job for another one

# Docker can start a container as root: the judge is the only process allowed to (ADR-0025)
- name: Create the judge's user
  ansible.builtin.user:
    name: log791-judge
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    groups: [docker]
    append: true

- name: Install the judge
  ansible.builtin.copy:
    src: "{{ log791_artifact_dirs.judge }}/judge"
    dest: "{{ log791_bin }}/judge"
    mode: "0755"
  notify: Restart the judges

# The packs the judge was built and tested with, from its own image
- name: Install the language packs
  ansible.builtin.copy:
    src: "{{ log791_artifact_dirs.judge }}/packs/"
    dest: "{{ log791_packs_dir }}/"
    mode: "0644"
    directory_mode: "0755"
  notify: Restart the judges

# From the packs just installed, on the VM: the images the judge runs. Not a fileglob on the
# operator's machine, which globs file names only and found no pack in packs/*/.
- name: Read the language pack images
  ansible.builtin.shell: set -o pipefail && sed -n 's/^image = "\(.*\)"$/\1/p' {{ log791_packs_dir }}/*/pack.toml | sort -u
  args:
    executable: /bin/bash
  register: judge_pack_images
  changed_when: false
  check_mode: false

# The judge never pulls one (docker run --pull never): a first run would wait for the download
# during an exam (ADR-0013)
- name: Preload the language pack images
  ansible.builtin.command: docker pull {{ item }}
  loop: "{{ judge_pack_images.stdout_lines }}"
  register: judge_pulled
  changed_when: "'Downloaded newer image' in judge_pulled.stdout"

- name: Configure the judge
  ansible.builtin.template:
    src: judge.env.j2
    dest: "{{ log791_config }}/judge.env"
    owner: root
    group: log791-judge
    mode: "0640"
  no_log: true
  notify: Restart the judges

- name: Install the judges' service
  ansible.builtin.template:
    src: log791-judge@.service.j2
    dest: /etc/systemd/system/log791-judge@.service
    mode: "0644"
  notify: Restart the judges

- name: Start the judges at boot
  ansible.builtin.systemd_service:
    name: log791-judge@{{ item }}
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ range(1, judge_instances + 1) | list }}"
