# The built web interface (apps/web/dist) under the server's root. Checked by tests/web/headers.sh.

# Named by their hash, so they never change. A missing one is a real 404, never the page: an HTML page
# cached for a year as a script would break that student's session (spec D21). The cache header
# has no `always`, so a 404 is not kept.
location /assets/ {
    try_files $uri =404;
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Browser runtimes, under a versioned path (spec D24)
location /runtimes/ {
    try_files $uri =404;
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Any other path is a route of the page. Read again on each load, so a release shows on the
# next reload while open tabs keep their files (ADR-0024).
location / {
    try_files $uri /index.html;
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
}
