# Included in every location, never set at the server level: nginx drops the server's add_header in any
# location that sets its own, so a page could lose its CSP with nothing visibly broken (spec D20).
# Checked by tests/web/headers.sh.
#
# No inline script or style and nothing from elsewhere: a statement that slips HTML in cannot run code
# or draw a fake interface (ADR-0023). data: images: merman embeds one in each diagram (spec D7).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
