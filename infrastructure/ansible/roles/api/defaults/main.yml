---
# The ÉTS directory (ADR-0017): identity only, never roles. Set by the inventory.
# api_ldap_url: ldaps://...
# api_ldap_base_dn: ...
# api_ldap_bind_dn: ...
# The CA that signs the directory's certificate, PEM: the only one the API trusts. Public, not a secret.
# api_ldap_ca_certificate: |
#   -----BEGIN CERTIFICATE-----
# The attribute a student types as their identifier
api_ldap_user_attribute: uid
