---
- name: Pull the image of {{ artifacts_app }}
  ansible.builtin.command: docker pull --quiet {{ artifacts_image }}
  changed_when: false
  # Reads only: also in check mode (drift.sh), where the tasks below need the digest
  check_mode: false
  when: log791_verify_attestation

- name: Read the image of {{ artifacts_app }}
  ansible.builtin.command: docker image inspect {{ artifacts_image }}
  register: artifacts_inspected
  changed_when: false
  # Reads only: also in check mode (drift.sh), where the tasks below need the digest
  check_mode: false

- name: Find the digest of the image of {{ artifacts_app }}
  ansible.builtin.set_fact:
    artifacts_id: "{{ artifacts_image_facts.Id.split(':') | last }}"
    artifacts_digest: >-
      {{ artifacts_image_facts.RepoDigests
         | select('match', (log791_image_prefix ~ '-' ~ artifacts_app ~ '@') | regex_escape)
         | first | default('') }}
  vars:
    artifacts_image_facts: "{{ (artifacts_inspected.stdout | from_json) | first }}"

# The provenance images.yml attests: built by that workflow, not another one of the repository,
# on GitHub's runners, from the release tag of the version deployed
- name: Verify the provenance of the image of {{ artifacts_app }}
  ansible.builtin.command:
    argv:
      - gh
      - attestation
      - verify
      - oci://{{ artifacts_digest }}
      - --repo={{ log791_repository }}
      - --signer-workflow={{ log791_repository }}/.github/workflows/images.yml
      - --source-ref=refs/tags/v{{ log791_version }}
      - --deny-self-hosted-runners
  changed_when: false
  # Reads only: also in check mode (drift.sh), where the tasks below need the digest
  check_mode: false
  when: log791_verify_attestation

# Into a partial directory first: a run stopped halfway leaves nothing a later run would trust
- name: Extract the files of {{ artifacts_app }}
  ansible.builtin.shell: |
    set -euo pipefail
    rm -rf "{{ artifacts_dir }}.partial"
    mkdir -p "{{ artifacts_dir }}.partial"
    container=$(docker create "{{ artifacts_reference }}" none)
    trap 'docker rm "$container" >/dev/null' EXIT
    docker cp "$container:/." "{{ artifacts_dir }}.partial"
    mv "{{ artifacts_dir }}.partial" "{{ artifacts_dir }}"
  args:
    executable: /bin/bash
    creates: "{{ artifacts_dir }}"
  vars:
    # What was verified is what is extracted
    artifacts_reference: "{{ artifacts_digest if log791_verify_attestation else artifacts_image }}"

- name: Remember the extracted files of {{ artifacts_app }}
  ansible.builtin.set_fact:
    artifacts_dirs: "{{ artifacts_dirs | default({}) | combine({artifacts_app: artifacts_dir}) }}"
