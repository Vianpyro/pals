# cargo deny: what a crate must be to enter the judge, the API or the publisher.
# ci.yml checks licenses, bans and sources on every change; nightly.yml checks advisories, which
# change without a commit here. Run locally: cargo deny check

[graph]
# The VMs and the operator's machine: a crate used only on another target is never built
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# Unmaintained crates are reported for the direct dependencies, the ones we chose
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licenses, and MPL-2.0 (file-level copyleft). The same list as dependency-review in
# ci.yml, which covers npm. A new license is a decision: add it here with the crate that needs it.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

# The workspace's own crates are not published (publish = false)
[licenses.private]
ignore = true

[bans]
# Two versions of one crate are compiled twice: reported, not refused
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependencies have no version: allowed, as nothing is published
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependency, no other registry
unknown-registry = "deny"
unknown-git = "deny"
