# Deploys the documents and the demo from main; ci.yml builds them on pull requests. On every push
# to main, not a path list: the docs area of .github/paths is the one list of what feeds the site.
name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_docs.yml
    with:
      upload: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Here only: the job that builds runs third-party code and must not hold them
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
