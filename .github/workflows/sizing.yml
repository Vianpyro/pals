# Minimum and recommended hardware per role, from the exam load measured in the dev container (ADR-0039).
# Not on pull requests: it takes the better part of an hour, and shared runners are noisy.
# Memory is what can fail this workflow; service times and CPU are reported as a trend.
name: Sizing

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sizing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # No harden-runner here: its DNS proxy leaves the dev container's compose network unable to
      # resolve any name (index.crates.io), and the dev container then fails to start.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The bursts find a machine's ceiling for each pack: a queue that never empties, sized to last
      # about a minute at each number of judges. The steady run sizes the web and database roles.
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: >-
            bash .devcontainer/check.sh
            && node --test tests/load/sizing.test.js
            && mkdir -p sizing
            && bash tests/load/run.sh 250 4 steady python 300 sizing/steady-python.json
            && for judges in 1 2 4 8; do
            bash tests/load/run.sh $((30 * judges)) "$judges" burst python 1 "sizing/burst-python-$judges.json" || exit 1;
            done
            && for judges in 1 2 4; do
            bash tests/load/run.sh $((8 * judges)) "$judges" burst java 1 "sizing/burst-java-$judges.json" || exit 1;
            done
            && node tests/load/sizing.js tests/load/budget.json sizing/*.json > sizing/report.md

      - name: Report
        if: always() && hashFiles('sizing/report.md') != ''
        run: cat sizing/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('sizing/*') != ''
        with:
          name: sizing
          path: sizing/
