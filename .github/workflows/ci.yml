name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same environment as locally: PostgreSQL, LDAP, gVisor and nginx, checked by check.sh.
  # Ignored tests need these services: they run here.
  # The queries are checked against the migrated schema; .sqlx/ must match it.
  # nginx's headers are checked on the built page; the web image build (images.yml) runs the web checks.
  # The student's journeys need the API and the judge: the demo runs in the background, and its log
  # is printed if the API never answers.
  devcontainer:
    runs-on: ubuntu-latest
    steps:
      # The release tags: the contracts are compared with the previous release's
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: >-
            bash .devcontainer/check.sh
            && bash tests/queries/check.sh
            && cargo test --locked -- --ignored
            && bash tests/contracts/check.sh
            && bash tests/contracts/compatible.sh
            && npm run build -w apps/web
            && bash tests/web/headers.sh
            && (bash .devcontainer/demo.sh > /tmp/demo.log 2>&1 &)
            && { timeout 300 sh -c 'until curl -sf http://localhost/api/health; do sleep 2; done' || { cat /tmp/demo.log; exit 1; }; }
            && CI=1 npm run e2e

  # The runner's rustup installs the toolchain of rust-toolchain.toml on first use.
  # No PostgreSQL here: query! macros read .sqlx/, written by cargo sqlx prepare.
  rust:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      # The tests rewrote packages/contracts/bindings (ts-rs): the committed TypeScript must match.
      # --intent-to-add: a binding the tests created, and nobody committed, shows in the diff.
      - name: Contracts
        run: |
          git add --intent-to-add packages/contracts/bindings
          git diff --exit-code -- packages/contracts/bindings

      # Component boundaries (ADR-0014), from the crate graph.
      - name: Architecture
        run: bash tests/architecture/boundaries.sh

  # Reference solutions of the ADR-0018 spike against the example exercises; removed with the spike.
  # The runner already has Python 3, Java and Node.js.
  exercises:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reference solutions
        run: bash spikes/build-or-reuse/check.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every tracked script, so a new one is checked without being listed here.
      - name: Shell scripts
        run: git ls-files -z '*.sh' '.githooks/*' | xargs -0 shellcheck

      # The commit-msg hook, for the commits that skipped it: web editor, Dependabot, another clone.
      - name: Commit messages
        if: github.event_name != 'workflow_dispatch'
        env:
          RANGE: ${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for sha in $(git rev-list "$RANGE"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            sh .githooks/commit-msg "$RUNNER_TEMP/message"
          done

      # Commit-msg hook and version bump rule of the release workflow.
      - name: Release
        run: bash tests/release/check.sh

      - name: Workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      # Same versions as the dev container, from its requirements file.
      - name: Ansible
        if: hashFiles('infrastructure/ansible/**/*.yml') != ''
        run: |
          pip install -r .devcontainer/requirements.txt
          ansible-lint infrastructure/ansible
