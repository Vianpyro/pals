# The page and the API on one origin, as in production: the session cookie is __Host- and SameSite.
# Serves the built page: npm run build -w apps/web (demo.sh does it). The production rules come from
# the nginx role's files, mounted as snippets/.
server {
    listen 80;
    # For WebKit, which keeps the Secure session cookie only over HTTPS (compose.yml, tls)
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    root /srv/app/dist;

    include snippets/web.conf;

    location /api/ {
        # The trailing slash strips /api: the API keeps its own routes
        proxy_pass http://localhost:8080/;
        # The API accepts 1 MiB of source; its JSON escaping can double that
        client_max_body_size 2m;
        include snippets/security-headers.conf;
    }
}
