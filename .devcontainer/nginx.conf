# The page and the API on one origin, as in production: the session cookie is __Host- and SameSite
server {
    listen 80;
    root /srv/web;

    # No inline script and nothing from elsewhere: a statement that slips HTML in cannot run code
    add_header Content-Security-Policy "default-src 'self'" always;

    location /api/ {
        # The trailing slash strips /api: the API keeps its own routes
        proxy_pass http://dev:8080/;
        # The API accepts 1 MiB of source; its JSON escaping can double that
        client_max_body_size 2m;
    }
}
