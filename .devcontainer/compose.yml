# Local services for development. Every password here is a development value.
name: log791

services:
  dev:
    build: .
    entrypoint: ["/usr/local/share/docker-init.sh"]
    command: sleep infinity
    volumes:
      - ..:/workspaces/LOG791:cached
      # Thousands of small files: slow on the bind mount, like the Cargo target below
      - node_modules:/workspaces/LOG791/node_modules
      - tls:/tls:ro
    environment:
      # Outside the bind mount: many small files there are slow under Docker Desktop,
      # and builds from the host would invalidate the container's.
      CARGO_TARGET_DIR: /home/vscode/target
      DATABASE_URL: postgresql://log791:log791@postgres:5432/log791
      # LDAPS with the directory's CA pinned, as the API requires (ADR-0017)
      LDAP_URL: ldaps://ldap:6360
      LDAP_CA_FILE: /tls/ldap-ca.crt
      LDAP_BASE_DN: dc=log791,dc=local
      # uid here; probably sAMAccountName on the ÉTS Active Directory.
      LDAP_USER_ATTRIBUTE: uid
      LDAP_BIND_DN: uid=svc-log791,ou=people,dc=log791,dc=local
      LDAP_BIND_PASSWORD: log791-svc
    depends_on:
      postgres:
        condition: service_healthy
      ldap:
        condition: service_healthy

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: log791
      POSTGRES_PASSWORD: log791
      POSTGRES_DB: log791
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "log791"]
      interval: 2s
      retries: 30

  ldap:
    image: lldap/lldap:v0.6.3
    environment:
      LLDAP_LDAP_BASE_DN: dc=log791,dc=local
      LLDAP_LDAP_USER_PASS: log791-admin
      LLDAP_JWT_SECRET: dev-only-jwt-secret
      LLDAP_KEY_SEED: dev-only-key-seed
      LLDAP_LDAPS_OPTIONS__ENABLED: "true"
      LLDAP_LDAPS_OPTIONS__PORT: "6360"
      LLDAP_LDAPS_OPTIONS__CERT_FILE: /tls/ldap.crt
      LLDAP_LDAPS_OPTIONS__KEY_FILE: /tls/ldap.key
    volumes:
      - tls:/tls:ro
    healthcheck:
      test: ["CMD", "/app/lldap", "healthcheck", "--config-file", "/data/lldap_config.toml"]
      interval: 2s
      retries: 30
    depends_on:
      tls:
        condition: service_completed_successfully

  # Creates the test accounts of ldap/ once lldap answers, then exits.
  ldap-seed:
    image: lldap/lldap:v0.6.3
    entrypoint: ["bash", "/bootstrap/seed.sh"]
    environment:
      LLDAP_URL: http://ldap:17170
      LLDAP_ADMIN_USERNAME: admin
      LLDAP_ADMIN_PASSWORD: log791-admin
    volumes:
      - ./ldap:/bootstrap:ro
    depends_on:
      ldap:
        condition: service_healthy
    restart: "no"

  # The page and the API on one origin, as nginx does in production.
  # In the dev container's network: the page is http://localhost there, a secure context, so the
  # browsers of the tests keep the Secure session cookie as a student's browser does.
  # apps/web, not apps/web/dist: Docker would create a missing dist/ as root, and the build could not write it.
  web:
    image: nginx:1.31.8-alpine
    network_mode: service:dev
    volumes:
      - ../apps/web:/srv/app:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../infrastructure/ansible/roles/nginx/files:/etc/nginx/snippets:ro
      - tls:/etc/nginx/tls:ro
    depends_on:
      tls:
        condition: service_completed_successfully

  # Certificates made once. A self-signed one for https://localhost: WebKit drops a Secure cookie over
  # plain HTTP even on localhost, and the session cookie is __Host- (Secure). A CA and the directory's
  # certificate it signs, so the API pins a CA here as it does the ÉTS one (ADR-0017); the key is
  # readable for lldap, a development value like every password here. The postgres image is the
  # one here that ships openssl.
  tls:
    image: postgres:18.6
    entrypoint:
      - sh
      - -c
      - |
        set -e
        [ -f /tls/localhost.crt ] || openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 \
          -nodes -days 3650 -subj /CN=localhost -addext subjectAltName=DNS:localhost,IP:127.0.0.1 \
          -keyout /tls/localhost.key -out /tls/localhost.crt
        if [ ! -f /tls/ldap.crt ]; then
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 3650 \
            -subj "/CN=LOG791 dev CA" -keyout /tls/ldap-ca.key -out /tls/ldap-ca.crt
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=ldap \
            -addext subjectAltName=DNS:ldap -keyout /tls/ldap.key -out /tls/ldap.csr
          openssl x509 -req -in /tls/ldap.csr -CA /tls/ldap-ca.crt -CAkey /tls/ldap-ca.key \
            -CAcreateserial -days 3650 -copy_extensions copyall -out /tls/ldap.crt
          chmod 644 /tls/ldap.key
        fi
    volumes:
      - tls:/tls
    restart: "no"

volumes:
  node_modules:
  tls:
