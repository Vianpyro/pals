[package]
name = "api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
content.workspace = true
contracts.workspace = true
ldap3 = { version = "0.12.1", default-features = false }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
sqlx.workspace = true
time = { version = "0.3.55", features = ["serde", "formatting"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.27.0", features = ["serde"] }

[lints]
workspace = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
