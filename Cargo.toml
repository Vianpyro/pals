[workspace]
resolver = "3"
members = [
    "apps/admin",
    "apps/api",
    "apps/judge",
    "apps/publisher",
    "packages/content",
    "packages/contracts",
]

[workspace.package]
version = "0.1.47"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
contracts = { path = "packages/contracts" }
content = { path = "packages/content" }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "time",
] }

[workspace.lints.rust]
dead_code_pub_in_binary = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
