[workspace]
resolver = "3"
members = [
    "apps/admin",
    "apps/api",
    "apps/judge",
    "apps/publisher",
    "packages/content",
    "packages/contracts",
]

[workspace.package]
version = "0.1.31"
edition = "2024"
rust-version = "1.99.0"
publish = false

[workspace.dependencies]
contracts = { path = "packages/contracts" }

[workspace.lints.rust]
dead_code_pub_in_binary = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
